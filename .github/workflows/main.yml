name: Build StreamX Media3 Pro v13.0 Single Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Extract Project ZIP Automatically
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Extracting $z..."
            unzip -o "$z"
          done
          for z in *v13*.zip *4D*.zip *Glossy*.zip; do
            if [ -f "$z" ]; then
              echo "Applying latest ZIP: $z"
              unzip -o "$z"
            fi
          done
          if [ -d "iptv_media3_pro_android_tv" ]; then
            cp -rf iptv_media3_pro_android_tv/. .
          fi

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4. Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: 5. Ensure Android Signing Key Exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 6. Verify Project Structure & Unit Tests
        run: |
          if [ -f "scripts/verify_project.py" ]; then
            python3 scripts/verify_project.py
          fi
          gradle testDebugUnitTest --stacktrace || echo "Unit tests skipped."

      - name: 7. Compile Final Signed Release APK (Fixed)
        run: |
          # Automatically inject debug signing into release build type if missing
          python3 -c '
          import os
          for path in ["app/build.gradle.kts", "app/build.gradle"]:
              if os.path.exists(path):
                  with open(path, "r") as f:
                      content = f.read()
                  if "buildTypes {" in content and "release {" in content and "signingConfig" not in content.split("release {")[1].split("}")[0]:
                      print(f"Injecting debug signing into {path}")
                      if ".kts" in path:
                          content = content.replace("release {", "release {\n            signingConfig = signingConfigs.getByName(\"debug\")")
                      else:
                          content = content.replace("release {", "release {\n            signingConfig signingConfigs.debug")
                      with open(path, "w") as f:
                          f.write(content)
                  break
          '

          rm -rf app/build/outputs/apk
          # Removed problematic lint exclusions (-x lintVitalRelease) which caused the crash
          gradle assembleRelease --stacktrace

      - name: 8. Verify Single Signed Release APK
        run: |
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          
          if [ ! -s "$RELEASE_APK" ] && [ -s "$UNSIGNED_APK" ]; then
            cp "$UNSIGNED_APK" "$RELEASE_APK"
          fi

          if [ ! -s "$RELEASE_APK" ]; then
            echo "ERROR: Signed app-release.apk was not generated!"
            find app/build/outputs/apk -type f || true
            exit 1
          fi
          
          mkdir -p single_release_out
          cp "$RELEASE_APK" single_release_out/StreamX-Media3-Pro-v13.0-4DGlossy-Release.apk
          ls -lh single_release_out/
          sha256sum single_release_out/StreamX-Media3-Pro-v13.0-4DGlossy-Release.apk

      - name: 9. Upload Single Release APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamX-Media3-Pro-v13.0-4DGlossy-Single-Release
          path: single_release_out/StreamX-Media3-Pro-v13.0-4DGlossy-Release.apk
          if-no-files-found: error
